name: Deploy to GitHub Pages

on:
  # Deliberately unfiltered. A `branches:` filter matches a literal ref name and does
  # not follow a default-branch rename, so a rename silently stops deploying and the
  # site goes stale with no failure anywhere. The branch check moved into the job,
  # where it reads the repository's CURRENT default branch.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'pull_request' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      # Pin code and artwork in the same revision. The immutable deployment also
      # leaves the older production asset URL available during review/rollback.
      ASSETS_BASE: https://f4a8e069.the-finals-outfit-assets.pages.dev/
      MODELS_BASE: https://a029b249.the-finals-outfit-assets.pages.dev/
      RECONSTRUCTION_BASE: https://c062af24.the-finals-outfit-assets.pages.dev/
      # Link-preview Worker (workers/share-preview). Blank hides the "Link with preview image" option.
      SHARE_PREVIEW_BASE: https://the-finals-outfit-share.chronohaxx.workers.dev
      # Showcase animation: emote clips, icons and prop GLBs (scripts/anim-export, 6 Nov 2026). Without it the
      # animation controls stay hidden. 12 Nov: set-5 clips + props-9 (emote prop placement fixes, root scale).
      ANIMATIONS_BASE: https://cf84e9b6.the-finals-outfit-assets.pages.dev/
      # Chinals mode (src/lib/site-mode.ts): the Chinals emote set (set-3 + props-2, 12 Nov 2026), on its own Cloudflare
      # Pages project the-finals-outfit-chinals-assets so it can be withdrawn in one step. Blank turns the mode off: no
      # toggle, and a Chinals link says the mode isn't available while its outfit still opens.
      CHINALS_ANIMATIONS_BASE: https://dcb131a5.the-finals-outfit-chinals-assets.pages.dev/
      # UI preview: another branch built into a sub-path of this same site, e.g.
      # https://chronohaxx.github.io/the-finals-outfit/new-ui-test/. Blank turns it off.
      # Off since the redesign it previewed became the root app; old preview links fall
      # through to 404.html, which is the app.
      PREVIEW_REF: ''
      PREVIEW_PATH: new-ui-test
      # Non-primary reconstruction packages (scripts/asset-shard-config.mjs), committed as a file: at 547 prefixes the
      # map no longer fits a Windows environment variable (87% release, 27 Oct 2026).
      RECONSTRUCTION_ROUTES_FILE: src/data/reconstruction-routes.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check sharing and changed application contracts
        run: |
          npm run validate:share-links
          node --import tsx --test tests/verified-bytes.test.ts tests/rig/reconstructed-material-cache.test.ts tests/asset-routing.test.mjs scripts/lib/stage-selection.test.mjs tests/rig/hidden-head.test.ts tests/rig/neutral-head-frame.test.ts tests/rig/source-material-recipients.test.ts tests/rig/source-outfit-metadata.test.ts tests/share-preview-worker.test.ts tests/share-pose.test.ts tests/rig/rig-animator.test.ts tests/rig/rig-animator-transport.test.ts tests/rig/share-preview-framing.test.ts
          node --import tsx --test tests/reconstruction-progress.test.ts tests/roadmap.test.ts tests/public-catalog.test.ts tests/wiki-catalog-import.test.mjs tests/reconstructed-samplers.test.mjs tests/catalog-host-groups.test.mjs tests/rig/source-identity-offset.test.mjs
          node --import tsx --test tests/coverage-projection.test.mjs tests/family-active-reuse.test.mjs tests/multipart-family.test.mjs tests/multipart-review-contract.test.mjs tests/outfit-scenario-contract.test.mjs scripts/shader-probe/capture-family.test.mjs scripts/shader-probe/family-fitting-evidence.test.mjs scripts/shader-probe/generate-family-review.test.mjs scripts/shader-probe/source-fitting.test.mjs

      - name: Validate catalog
        run: npm run validate:catalog

      - name: Build
        env:
          # Serve from /<repo>/ on github.io; override if a custom domain is set.
          VITE_BASE: /${{ github.event.repository.name }}/
          # Where every asset is served from. Nothing extracted is committed, so with
          # this unset the site builds and deploys but renders no artwork.
          VITE_ASSETS_BASE: ${{ env.ASSETS_BASE }}
          VITE_MODELS_BASE: ${{ env.MODELS_BASE }}
          VITE_RECONSTRUCTION_BASE: ${{ env.RECONSTRUCTION_BASE }}
          VITE_SHARE_PREVIEW_BASE: ${{ env.SHARE_PREVIEW_BASE }}
          VITE_ANIMATIONS_BASE: ${{ env.ANIMATIONS_BASE }}
          VITE_CHINALS_ANIMATIONS_BASE: ${{ env.CHINALS_ANIMATIONS_BASE }}
          VITE_RECONSTRUCTION_ROUTES_FILE: ${{ env.RECONSTRUCTION_ROUTES_FILE }}
          # Terms public text must never contain (src/lib/public-text.ts). Only the build reads it, and it
          # never prints a term. No VITE_ prefix, so it never reaches the app bundle. Empty when the secret
          # is unset, and in pull requests from forks.
          PUBLIC_TEXT_DENYLIST: ${{ secrets.PUBLIC_TEXT_DENYLIST }}
        run: npm run build

      - name: Check the catalog ships beside the entry chunk
        run: npm run check:catalog-split

      - name: Copy 404.html for SPA fallback
        run: cp dist/index.html dist/404.html

      # Pages publishes one artifact for the whole site, so a preview has to ride along
      # with main's deploy. It uses the same pinned asset hosts as production and is
      # refreshed whenever main deploys (a push to main, or "Run workflow" on main);
      # pushing to the preview branch alone does not redeploy it. A missing branch or a
      # failed preview build never blocks the production deploy: it warns and ships
      # without the preview.
      - name: Build UI preview
        if: env.PREVIEW_REF != ''
        continue-on-error: true
        env:
          VITE_BASE: /${{ github.event.repository.name }}/${{ env.PREVIEW_PATH }}/
          VITE_ASSETS_BASE: ${{ env.ASSETS_BASE }}
          VITE_MODELS_BASE: ${{ env.MODELS_BASE }}
          VITE_RECONSTRUCTION_BASE: ${{ env.RECONSTRUCTION_BASE }}
          VITE_SHARE_PREVIEW_BASE: ${{ env.SHARE_PREVIEW_BASE }}
          VITE_ANIMATIONS_BASE: ${{ env.ANIMATIONS_BASE }}
          VITE_CHINALS_ANIMATIONS_BASE: ${{ env.CHINALS_ANIMATIONS_BASE }}
          # The production routes file, by absolute path, so the preview checkout uses the same hosts.
          VITE_RECONSTRUCTION_ROUTES_FILE: ${{ github.workspace }}/${{ env.RECONSTRUCTION_ROUTES_FILE }}
        run: |
          if ! git fetch --depth=1 origin "refs/heads/$PREVIEW_REF"; then
            echo "::warning::Preview branch $PREVIEW_REF not found; deploying without /$PREVIEW_PATH/"
            exit 0
          fi
          git worktree add --detach "$RUNNER_TEMP/preview" FETCH_HEAD
          cd "$RUNNER_TEMP/preview"
          echo "UI preview: \`$PREVIEW_REF\` at $(git rev-parse --short HEAD) → /$PREVIEW_PATH/" >> "$GITHUB_STEP_SUMMARY"
          npm ci
          npm run build
          # Keep the preview out of search results.
          sed -i 's|<head>|<head>\n    <meta name="robots" content="noindex, nofollow" />|' dist/index.html
          mkdir -p "$GITHUB_WORKSPACE/dist/$PREVIEW_PATH"
          cp -R dist/. "$GITHUB_WORKSPACE/dist/$PREVIEW_PATH/"

      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == github.event.repository.default_branch
        with:
          path: dist

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
