name: Site health

# HTTP check of the live app and every asset host it is built against (scripts/lib/site-health.mjs). The hosts come
# from deploy.yml and the committed routes file, so a release that swaps hosts needs no change here.
on:
  workflow_dispatch:
  # Hourly, off the hour. Asset deployments are immutable, so a tighter schedule mostly spends runner minutes
  # (free while the repository is public; a private repository on GitHub Free has roughly 2,000 a month).
  # GitHub runs schedules on a best-effort basis and pauses them after 60 days without repository activity.
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
  pull_request:
    paths:
      - '.github/workflows/site-health.yml'
      - '.github/workflows/deploy.yml'
      - 'scripts/check-site-health.mjs'
      - 'scripts/lib/site-health*'
      - 'src/data/reconstruction-routes.json'
      - 'src/lib/asset-routing.mjs'
      - 'src/lib/analytics.ts'
      - 'tests/analytics.test.ts'

permissions:
  contents: read

# Its own group, never deploy.yml's: a queued check would replace, and so cancel, a pending deploy. A check that
# lands mid-deploy (deploys took 1-6 minutes in November 2026) retries for about 10 minutes before it fails.
concurrency:
  group: site-health-${{ github.ref }}

jobs:
  live:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Dependency-free: no npm ci, so a passing run takes seconds.
      - name: Check the live site and its asset hosts
        run: node scripts/check-site-health.mjs

  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test the monitor and the analytics gate
        run: node --import tsx --test scripts/lib/site-health.test.mjs tests/analytics.test.ts
