<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <title>Outfit Builder · fan-made for THE FINALS</title>
    <meta name="description" content="Fan-made cosmetic outfit builder for THE FINALS. Compose a look in 3D and share it by URL." />
    <meta property="og:title" content="Outfit Builder · fan-made for THE FINALS" />
    <meta property="og:description" content="Fan-made cosmetic outfit builder for THE FINALS. Compose a look in 3D and share it by URL." />
    <meta property="og:type" content="website" />
  </head>
  <body class="antialiased">
    <!--
      Static shell, replaced by React once the catalog has loaded (src/main.tsx). The
      entry chunk is ~450 KB gzipped, and the catalog follows as ~360 KB gzipped of JSON
      files preloaded in parallel (vite.config.ts), so a cold visit on a slow phone
      connection has several seconds with nothing to render. An empty #root is a blank
      page, and a blank page is indistinguishable from a broken one. This is plain
      markup in the HTML document, so it paints on first byte with no JS and no
      network round trip. If the catalog cannot load, #boot-status says so. Inline
      styles only: the stylesheet arrives with the bundle.
    -->
    <div id="root">
      <div style="min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#09090b;color:#f2efe9;font-family:ui-sans-serif,system-ui,sans-serif;text-align:center;padding:24px">
        <style>@keyframes shell-sweep{from{transform:translateX(-100%)}to{transform:translateX(250%)}}@media (prefers-reduced-motion:reduce){.shell-bar{animation:none!important}}</style>
        <div style="font-size:28px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;line-height:1">Outfit Builder</div>
        <div id="boot-status" role="status" style="font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#6f6d76">Loading the catalog</div>
        <div style="position:relative;width:140px;height:2px;overflow:hidden;background:#222228">
          <div class="shell-bar" style="position:absolute;inset:0;width:40%;background:#d21f3c;animation:shell-sweep 1.1s cubic-bezier(.5,0,.5,1) infinite"></div>
        </div>
        <noscript style="font-size:14px;color:#fca5a5">
          This builder needs JavaScript to run.
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
