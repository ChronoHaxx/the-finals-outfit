<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0e" />
    <title>THE FINALS Outfit Builder — Try Every Cosmetic in 3D</title>
    <meta name="description" content="Fan-made outfit builder for THE FINALS. Mix and match cosmetics from every season, turn your look around in 3D and share it with a link." />
    <!--
      Search and link previews. Absolute URLs are the production site (GitHub Pages); update them together if the
      site moves to a custom domain. Preview deployments keep pointing here, so only the production page is indexed.
    -->
    <link rel="canonical" href="https://chronohaxx.github.io/the-finals-outfit/" />
    <meta property="og:site_name" content="the-finals-outfit" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chronohaxx.github.io/the-finals-outfit/" />
    <meta property="og:title" content="THE FINALS Outfit Builder" />
    <meta property="og:description" content="Fan-made outfit builder for THE FINALS. Mix and match cosmetics from every season, turn your look around in 3D and share it with a link." />
    <meta property="og:image" content="https://chronohaxx.github.io/the-finals-outfit/og-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Two outfits from THE FINALS shown in 3D: a yellow Sentinel set and a pink track jacket with camo cargo pants" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="THE FINALS Outfit Builder" />
    <meta name="twitter:description" content="Fan-made outfit builder for THE FINALS. Mix and match cosmetics from every season, turn your look around in 3D and share it with a link." />
    <meta name="twitter:image" content="https://chronohaxx.github.io/the-finals-outfit/og-card.jpg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "THE FINALS Outfit Builder",
        "alternateName": "the-finals-outfit",
        "url": "https://chronohaxx.github.io/the-finals-outfit/",
        "description": "Fan-made outfit builder for THE FINALS. Mix and match cosmetics from every season, turn your look around in 3D and share it with a link.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any (web browser)",
        "isAccessibleForFree": true,
        "about": { "@type": "VideoGame", "name": "THE FINALS" }
      }
    </script>
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased">
    <!--
      Static shell, replaced by React on mount. The bundle is ~420 KB gzipped and on a
      cold visit nothing rendered for about ten seconds — an empty #root is a blank
      page, and a blank page is indistinguishable from a broken one. This is plain
      markup in the HTML document, so it paints on first byte with no JS and no
      network round trip.
    -->
    <div id="root">
      <div style="min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.75rem;font-family:ui-sans-serif,system-ui,sans-serif;color:#a3a3a3;text-align:center;padding:1.5rem">
        <h1 style="margin:0;font-size:1.125rem;font-weight:600;color:#f5f5f5">THE FINALS Outfit Builder</h1>
        <p style="margin:0;max-width:32rem;font-size:0.875rem">Mix and match cosmetics from every season of THE FINALS,
          turn your look around in 3D and share it with a link. Fan-made, unaffiliated with Embark Studios.</p>
        <div style="font-size:0.875rem">Loading the catalog…</div>
        <noscript style="font-size:0.875rem;color:#fca5a5">
          This builder needs JavaScript to run.
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
