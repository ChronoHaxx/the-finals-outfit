<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <title>THE FINALS Outfit Builder · Fan-made, try on cosmetics in 3D</title>
    <meta name="description" content="Fan-made outfit builder for THE FINALS. Mix and match cosmetics from every season, turn your look around in 3D and share it with a link." />
    <!--
      Search and link previews. Absolute URLs are the production site (GitHub Pages); update them together if the
      site moves to a custom domain. Preview deployments keep pointing here, so only the production page is indexed.
      No item counts here: they change with every catalog update and live in one place in the app.
    -->
    <link rel="canonical" href="https://chronohaxx.github.io/the-finals-outfit/" />
    <meta property="og:site_name" content="the-finals-outfit" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chronohaxx.github.io/the-finals-outfit/" />
    <meta property="og:title" content="THE FINALS Outfit Builder" />
    <meta property="og:description" content="Fan-made outfit builder for THE FINALS. Mix and match cosmetics from every season, turn your look around in 3D and share it with a link." />
    <meta property="og:image" content="https://chronohaxx.github.io/the-finals-outfit/og-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Two outfits from THE FINALS shown in 3D: a yellow Sentinel set and a pink track jacket with camo cargo pants" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="THE FINALS Outfit Builder" />
    <meta name="twitter:description" content="Fan-made outfit builder for THE FINALS. Mix and match cosmetics from every season, turn your look around in 3D and share it with a link." />
    <meta name="twitter:image" content="https://chronohaxx.github.io/the-finals-outfit/og-card.jpg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "THE FINALS Outfit Builder",
        "alternateName": ["Outfit Builder", "the-finals-outfit"],
        "url": "https://chronohaxx.github.io/the-finals-outfit/",
        "description": "Fan-made outfit builder for THE FINALS. Mix and match cosmetics from every season, turn your look around in 3D and share it with a link.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any (web browser)",
        "isAccessibleForFree": true,
        "about": { "@type": "VideoGame", "name": "THE FINALS" }
      }
    </script>
  </head>
  <body class="antialiased">
    <!--
      Static shell, replaced by React once the catalog has loaded (src/main.tsx). The
      entry chunk is ~450 KB gzipped, and the catalog follows as ~360 KB gzipped of JSON
      files preloaded in parallel (vite.config.ts), so a cold visit on a slow phone
      connection has several seconds with nothing to render. An empty #root is a blank
      page, and a blank page is indistinguishable from a broken one. This is plain
      markup in the HTML document, so it paints on first byte with no JS and no
      network round trip. If the catalog cannot load, #boot-status says so. Inline
      styles only: the stylesheet arrives with the bundle. The heading and the sentence
      under it are also what search engines read before React mounts.
    -->
    <div id="root">
      <div style="min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#09090b;color:#f2efe9;font-family:ui-sans-serif,system-ui,sans-serif;text-align:center;padding:24px">
        <style>@keyframes shell-sweep{from{transform:translateX(-100%)}to{transform:translateX(250%)}}@media (prefers-reduced-motion:reduce){.shell-bar{animation:none!important}}</style>
        <h1 style="margin:0;font-size:28px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;line-height:1"><span style="display:block;margin-bottom:8px;font-size:11px;font-weight:600;letter-spacing:.18em;color:#a6a4ab">THE FINALS</span> Outfit Builder</h1>
        <p style="margin:0;max-width:22rem;font-size:13px;line-height:1.5;color:#a6a4ab">Mix and match cosmetics from every season of THE FINALS,
          turn your look around in 3D and share it with a link. Fan-made, unaffiliated with Embark Studios.</p>
        <div id="boot-status" role="status" style="font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#6f6d76">Loading the catalog</div>
        <div style="position:relative;width:140px;height:2px;overflow:hidden;background:#222228">
          <div class="shell-bar" style="position:absolute;inset:0;width:40%;background:#d21f3c;animation:shell-sweep 1.1s cubic-bezier(.5,0,.5,1) infinite"></div>
        </div>
        <noscript style="font-size:14px;color:#fca5a5">
          This builder needs JavaScript to run.
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
